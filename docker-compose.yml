# Recommandé pour le développement local
# Utiliser 'docker-compose up -d' pour lancer

services:
  # Application Laravel (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reviewme-app
    image: reviewme:latest
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
      - ./database:/var/www/html/database
    environment:
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - APP_ENV=local
      - APP_DEBUG=false
      - SESSION_DRIVER=file
      - CACHE_STORE=file
    depends_on:
      - mysql

  # Serveur Web (Nginx)
  web:
    image: nginx:stable-alpine
    container_name: reviewme-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # Base de données (MySQL) - Optionnel si SQLite utilisé, mais prêt pour MVP
  mysql:
    image: mysql:8.0
    container_name: reviewme-db
    restart: unless-stopped
    # ports:
    #   - "3306:3306" # Interdit en production, décommenter uniquement pour debug local spécifique
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_should_be_changed}
      MYSQL_DATABASE: reviewme
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
